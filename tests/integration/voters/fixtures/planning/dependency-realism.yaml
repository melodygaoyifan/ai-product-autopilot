voter: dependency-realism
fixtures:
  - label: consumes-api-without-edge
    kind: positive
    should_find: true
    must_mention: ["depend"]
    artifact: |
      tasks:
        - {id: t1, title: "Orders API", depends_on: [],
           files_expected: ["api/orders.py"]}
        - {id: t2, title: "Orders dashboard consuming /api/orders",
           depends_on: [], files_expected: ["web/dashboard.js"]}
  - label: shared-file-no-edge
    kind: positive
    should_find: true
    must_mention: ["edge"]
    artifact: |
      tasks:
        - {id: t1, title: "User model", depends_on: [],
           files_expected: ["models.py"]}
        - {id: t2, title: "Session handling", depends_on: [],
           files_expected: ["models.py", "auth.py"]}
  - label: false-edge-serializes
    kind: positive
    should_find: true
    must_mention: ["false"]
    artifact: |
      tasks:
        - {id: t1, title: "Landing page copy", depends_on: [],
           files_expected: ["site/index.html"]}
        - {id: t2, title: "Database schema", depends_on: [t1],
           files_expected: ["db/schema.sql"]}
      note: no artifact flows from copywriting to the schema.
