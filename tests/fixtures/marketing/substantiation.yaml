# claim_substantiation_check fixture gate (§21.58.1) — 8 cases.
# expect.rules is the exact set of rules that must fire (empty = clean).
fixtures:
  - label: unregistered-capability
    expect: {rules: [unsubstantiated]}
    input:
      draft_text: "avs integrates with every major ATS on the market."
      register: []
  - label: number-drift
    expect: {rules: [number_drift]}
    input:
      draft_text: "Exports 15,000 rows in under 4 seconds."
      register:
        - {id: C-101, text: "exports 12,000 rows in under 4 seconds",
           source_type: primary_measured}
  - label: superlative-on-cited-claim
    expect: {rules: [unmeasured_superlative]}
    input:
      draft_text: "The fastest CSV export for recruiting teams."
      register:
        - {id: C-102, text: "fastest CSV export for recruiting teams",
           source_type: primary_cited}
  - label: unregistered-price
    expect: {rules: [unsubstantiated]}
    input:
      draft_text: "Plans start at $29 per seat."
      register:
        - {id: C-101, text: "exports 12,000 rows in under 4 seconds",
           source_type: primary_measured}
  - label: clean-registered-match
    expect: {rules: []}
    input:
      draft_text: "avs exports 12,000 rows in under 4 seconds."
      register:
        - {id: C-101, text: "exports 12,000 rows in under 4 seconds",
           source_type: primary_measured}
  - label: clean-no-assertions
    expect: {rules: []}
    input:
      draft_text: "Read about our journey on the blog."
      register: []
  - label: boundary-number-within-tolerance
    expect: {rules: []}
    input:
      draft_text: "Exports 12,500 rows in under 4 seconds."
      tol: 0.05
      register:
        - {id: C-101, text: "exports 12,000 rows in under 4 seconds",
           source_type: primary_measured}
  - label: boundary-superlative-measured
    expect: {rules: []}
    input:
      draft_text: "The fastest CSV export for recruiting teams."
      register:
        - {id: C-102, text: "fastest CSV export for recruiting teams",
           source_type: primary_measured}
