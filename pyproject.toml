[project]
name = "autoproduct"
version = "0.33.1"
description = "AI product autopilot: a full-lifecycle multi-agent system that finds opportunities, writes PRDs, builds, launches, and measures — with typed claims and human gates"
readme = "README.md"
authors = [
    { name = "melodygaoyifan", email = "168382010+melodygaoyifan@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.118.0",
    "fastapi>=0.139.2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "playwright>=1.61.0",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

license = "MIT"
keywords = ["multi-agent", "ai", "product", "sdlc", "autopilot", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/melodygaoyifan/ai-product-autopilot"
Changelog = "https://github.com/melodygaoyifan/ai-product-autopilot/blob/main/CHANGELOG.md"

[project.scripts]
autoproduct = "autoproduct.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mutmut>=3.6.0",
    "pycryptodome>=3.20",
    "pytest>=9.1.1",
]
