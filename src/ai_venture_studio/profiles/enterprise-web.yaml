name: enterprise-web
description: Internal enterprise web tool (governed frontend + typed API) — the web profile plus the constraints an IT/security review will actually ask about
constraints:
  - The FDR's scope is law — a capability it explicitly excludes or defers ("暂时不要", "not now", "later") must not appear in any spec. A constraint below that concerns an excluded capability is inapplicable, never a reason to add the capability.
  - All configuration comes from environment variables read at startup — no credentials, hostnames, or ports hardcoded anywhere. A required variable that is missing fails startup with an error naming the variable; secrets additionally accept the <VAR>_FILE mounted-secret convention.
  - The service exposes GET /api/health returning 200 with a JSON body while healthy — unauthenticated, side-effect-free, and cheap, because the enterprise's load balancer and monitoring will poll it.
  - Every state-changing action appends an audit record (actor identifier, action, subject, timestamp) to persistent storage. Audit records are append-only — no endpoint, job, or migration deletes or rewrites them. Where the FDR has no logins, the actor is the client-supplied name the FDR's flow already collects.
  - Data survives restarts by default (SQLite file unless the FDR names another store), and the database location/DSN is an environment variable so operations can point it at managed storage without a code change.
  - Where the product includes accounts or login, every state-changing endpoint has CSRF protection and an auth check, and authorization is role-based with roles stored as data. Products without login expose their endpoints unauthenticated — do not invent sessions, tokens, or CSRF machinery for them.
  - Where the product fetches or redirects to user-supplied URLs, that code path guards against SSRF and open redirects (reject non-http/https schemes at minimum; a host allowlist where the FDR calls for one). Build this INSIDE the endpoint that handles the URL — never as a separate task, endpoint, or configuration surface the FDR did not ask for.
  - Endpoints never crash on user input. Invalid JSON, wrong types, missing or unknown fields get an explicit 4xx error response whose JSON body carries a human-readable message in an "error" field (unless the FDR fixes another shape); an unhandled exception on malformed input is a defect. Every endpoint spec includes at least one malformed-input criterion.
  - JSON endpoints intended for other systems (the FDR's integration consumers) are versioned under /api/ and their response shape is stated in the spec — downstream teams integrate against the contract, not the implementation.
  - Where the product includes pages, accessibility is not optional — interactive elements are keyboard-reachable and labeled — and Core Web Vitals budgets are part of done. Every user-facing flow gets a Playwright-style E2E test skeleton before implementation starts; API-only products need behavioral tests against the HTTP surface instead.
spec_extras:
  - State the API contract (method, path, request/response shape) for every endpoint the feature adds, and name which consumers (from the FDR) read it.
  - Name the audit records the feature appends (actor, action, subject) and the criterion that proves they are written.
  - List every environment variable the feature introduces, with its default and whether it is a secret.
checks:
  - playwright (availability-gated)
  - lighthouse budgets (availability-gated)
stack_hint: 'Keep the stack boring — FastAPI with typed request/response models (pydantic), SQLite via the stdlib unless the FDR names another store; the DSN/path always comes from an environment variable. Frontend: vanilla JS (TypeScript compiled with esbuild ONLY if the brief demands it and node is available — never assume a node toolchain on the build host). BOOT CONTRACT: the entry point app/main.py (or main.py / app.py) MUST start the server itself when executed directly — `python app/main.py` — binding 127.0.0.1 on the PORT env var (default 8000). For FastAPI end the file with: if __name__ == "__main__": import uvicorn; uvicorn.run(app, host="127.0.0.1", port=int(os.environ.get("PORT", "8000"))). The founder and every verification harness run the product exactly this way; an app that only boots via an external `uvicorn app.main:app` command is not done.'
