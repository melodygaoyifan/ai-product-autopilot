# Edition E2: solo / OPC (一人公司) — doc 24 §70. Narrowing preset; raising
# any line back toward the framework default is one YAML edit (§70.3).
edition: solo
version: 1
defaults:
  substrate_rung: S0
  wip_limit: 1
  channels_enabled: [content_geo, product_surface]
  cadence_ceilings: {content_geo: 2/week}
gate_policy:
  consolidation: weekly_review
  never_consolidate: [PL5, incident, consent_override, gate3_sensitive]
  require_gate_owner: false
attention:
  weekly_review_minutes: 45
  dwell_check_blocking: true
docs_entry: editions/solo/START-HERE.md
